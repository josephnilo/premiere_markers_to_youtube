[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "premiere-markers-to-youtube"
version = "0.2.0"
description = "Convert Adobe Premiere Pro marker exports to YouTube chapters"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joseph Nilo" }]
dependencies = []
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
  "Topic :: Utilities",
]

[project.scripts]
premiere-markers-to-youtube = "premiere_markers_to_youtube:main"

[project.urls]
Repository = "https://github.com/josephnilo/premiere_markers_to_youtube"
Issues = "https://github.com/josephnilo/premiere_markers_to_youtube/issues"

[tool.setuptools]
py-modules = ["premiere_markers_to_youtube"]
